
name: Build Akatsuki APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q Akatsuki-Flashcard-Android-CloudBuild.zip -d source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: source/flashcard-akatsuki (v26)
        run: |
          npm install
          npm run build:web
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akatsuki-Flashcard-APK
          path: source/flashcard-akatsuki (v26)/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          

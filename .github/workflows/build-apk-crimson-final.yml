name: Build Akatsuki APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Akatsuki project
        run: unzip -oq Akatsuki-Flashcard-Crimson-Android.zip -d source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: source/flashcard-akatsuki (v26)
        run: npm install

      - name: Prepare web app
        working-directory: source/flashcard-akatsuki (v26)
        run: npm run build:web

      - name: Add Android platform
        working-directory: source/flashcard-akatsuki (v26)
        run: npx cap add android

      - name: Generate Akatsuki icons and splash screen
        working-directory: source/flashcard-akatsuki (v26)
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: source/flashcard-akatsuki (v26)
        run: npx cap sync android

      - name: Build APK
        working-directory: source/flashcard-akatsuki (v26)/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akatsuki-Flashcard-Crimson-APK
          path: source/flashcard-akatsuki (v26)/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
